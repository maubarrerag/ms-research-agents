[project]
name = "msagents"
version = "0.1.0"
description = "Local multi-agent research system for investigating causes and treatments of multiple sclerosis"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",        # virtual mouse / patient simulator
]

[project.optional-dependencies]
analysis = ["scipy", "pandas", "statsmodels"]
litellm = ["litellm>=1.50"]
dev = ["pytest>=8"]

[project.scripts]
msagents = "msagents.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
